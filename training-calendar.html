    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:60px}
  .wrap{max-width:820px;margin:0 auto;padding:0 14px}

  /* app bar */
  .appbar{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,var(--scarlet) 0%,var(--scarlet-dk) 100%);
    padding-top:env(safe-area-inset-top);box-shadow:0 2px 14px rgba(0,0,0,.45)}
  .monthnav{display:flex;align-items:center;gap:10px;padding:10px 0}
  .monthnav button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;
    font-family:inherit;font-size:20px;width:40px;height:40px;border-radius:11px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:.15s}
  .monthnav button:hover:not(:disabled){background:rgba(255,255,255,.24)}
  .monthnav button:disabled{opacity:.35;cursor:default}
  .monthnav .mtitle{flex:1;text-align:center;font-size:18px;font-weight:800;letter-spacing:.6px;color:#fff;text-transform:uppercase}
  .btn-today{display:block;margin:14px auto 10px;background:transparent;border:1.5px solid var(--scarlet);
    color:#fff;font-family:inherit;font-size:12px;font-weight:600;padding:6px 16px;border-radius:20px;cursor:pointer;letter-spacing:.3px}
  .btn-today:hover{background:var(--scarlet)}

  /* calendar */
  .dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px}
  .dow-row div{text-align:center;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cell{position:relative;min-height:66px;border-radius:10px;padding:6px 6px 5px;border:1px solid var(--border);
    background:var(--panel);cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:.12s;overflow:hidden}
  .cell:hover{border-color:var(--gray);transform:translateY(-1px)}
  .cell.blank{background:transparent;border:none;cursor:default;min-height:0}
  .cell.out{opacity:.28;cursor:default}
  .cell.out:hover{transform:none;border-color:var(--border)}
  .dnum{font-size:12px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
  .cell.today{border:1.5px solid var(--scarlet);box-shadow:0 0 0 1px var(--scarlet),0 0 14px rgba(186,12,47,.35)}
  .cell.today .dnum{color:#fff;background:var(--scarlet);border-radius:6px;padding:0 5px;align-self:flex-start}
  .cell.sel{background:var(--panel2);border-color:#fff;box-shadow:0 0 0 1px #fff}
  .cell.today.sel{box-shadow:0 0 0 1px #fff,0 0 14px rgba(186,12,47,.35)}
  .cell.rest{background:transparent}
  .cell.rest .lab{color:var(--dim);font-weight:500}
  .cell.race{background:linear-gradient(160deg,var(--scarlet) 0%,var(--scarlet-dk) 100%);border-color:var(--scarlet)}
  .cell.race .dnum,.cell.race .lab{color:#fff}
  .cell.race .lab{letter-spacing:1px;font-weight:800}
  .cell.race .rdot{background:#fff}
  .cell.allmissed .lab{text-decoration:line-through;color:var(--dim)}
  .cell.alldone{border-color:rgba(186,12,47,.55)}
  .cell.alldone .lab{color:var(--muted)}
  .lab{font-size:11px;font-weight:700;line-height:1.15;margin-top:auto;color:var(--text)}
  .lab.sm{font-size:9.5px;letter-spacing:-.1px}
  .rdot{position:absolute;top:8px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--scarlet)}
  .mk{font-size:9.5px;color:var(--scarlet-tx);display:flex;gap:4px;font-weight:700;letter-spacing:.3px}
  .mk .missed{color:var(--dim);text-decoration:line-through}

  .legend{display:flex;flex-wrap:wrap;gap:14px;margin:14px 2px 0;font-size:11.5px;color:var(--muted)}
  .legend b{color:var(--scarlet-tx);font-weight:700}

  /* detail */
  #detail{margin-top:18px;scroll-margin-top:calc(env(safe-area-inset-top) + 74px)}
  .tbox{scroll-margin-top:calc(env(safe-area-inset-top) + 74px)}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden}
  .card-head{padding:14px 16px;display:flex;align-items:flex-start;gap:12px;
    background:linear-gradient(180deg,var(--panel2),var(--panel));border-top:4px solid var(--scarlet);border-bottom:1px solid var(--border)}
  .card-head .meta{flex:1;min-width:0}
  .card-head .d-date{font-size:12px;color:var(--scarlet-tx);font-weight:700;letter-spacing:.8px}
  .card-head .d-title{font-size:19px;font-weight:800;margin-top:2px}
  .card-head .d-phase{font-size:11.5px;color:var(--muted);margin-top:3px}
  .card-head .closeb{background:var(--panel2);border:1px solid var(--border);color:var(--muted);
    width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px;flex-shrink:0}
  .card-head .closeb:hover{color:#fff;border-color:var(--gray)}
  .badge{display:inline-block;font-size:10px;letter-spacing:1px;padding:2px 9px;border-radius:20px;font-weight:800;
    margin-left:6px;vertical-align:middle;background:var(--scarlet);color:#fff}
  .card-body{padding:16px}

  .section{margin-bottom:20px}
  .section:last-child{margin-bottom:0}
  .sec-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border)}
  .sec-label{font-size:10.5px;letter-spacing:2px;color:#fff;font-weight:800;text-transform:uppercase}
  .sec-head .sec-label{flex:1;min-width:140px;border-left:3px solid var(--scarlet);padding-left:8px}
  .section > .sec-label{margin-bottom:8px;border-left:3px solid var(--scarlet);padding-left:8px}
  ul.sec-body{list-style:none} ul.sec-body li{font-size:13px;color:var(--hi);padding-left:16px;position:relative;margin-bottom:4px}
  ul.sec-body li:before{content:'';position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:2px;background:var(--scarlet)}
  .note-line{font-size:12.5px;color:var(--hi);background:var(--panel2);border-left:3px solid var(--gray);border-radius:4px 9px 9px 4px;padding:10px 12px}
  .note-line + .note-line{margin-top:8px}

  .mrow{display:flex;gap:6px}
  .mbtn{background:transparent;border:1.5px solid var(--border);color:var(--muted);font-family:inherit;
    font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:20px;cursor:pointer;transition:.12s}
  .mbtn:hover{border-color:var(--gray);color:#fff}
  .mbtn.on{background:var(--scarlet);border-color:var(--scarlet);color:#fff}
  .mbtn.miss.on{background:var(--gray);border-color:var(--gray);color:#141617}

  .ex-name{font-weight:800;font-size:14px}
  .ex-note{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45}
  .sub-label{font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:800;text-transform:uppercase;margin:14px 0 7px}

  /* lift table */
  .tbox{background:var(--panel2);border:1px solid var(--border);border-radius:11px;overflow:hidden;margin:10px 0 4px}
  table.lt{width:100%;border-collapse:collapse;table-layout:fixed}
  .lt col.c-ex{width:43%} .lt col.c-set{width:13%} .lt col.c-w{width:24%} .lt col.c-r{width:20%}
  .lt thead tr{background:var(--scarlet)}
  .lt th{font-size:9.5px;letter-spacing:1.5px;color:#fff;font-weight:800;text-transform:uppercase;text-align:left;padding:7px 6px}
  .lt tbody{border-top:1px solid var(--border)}
  .lt thead + tbody{border-top:none}
  .lt td{padding:3px 4px;vertical-align:middle;font-variant-numeric:tabular-nums}
  .lt td.exc{vertical-align:top;padding:9px 6px 9px 8px}
  .exn{font-weight:800;font-size:13px;line-height:1.25}
  .exs{font-size:11px;color:var(--gray);margin-top:3px;line-height:1.3}
  .ext{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.35;border-left:2px solid var(--scarlet);padding-left:6px}
  .ext b{color:#fff}
  .lt td.sc{font-size:11px;color:var(--muted);font-weight:700}
  .lt tr.wu td{color:var(--muted);font-size:13px;padding-top:5px;padding-bottom:5px}
  .lt tr.wu td.sc{font-size:10px;letter-spacing:.5px;color:var(--dim)}
  .lt tbody tr:first-child td{padding-top:8px}
  .lt tbody tr:last-child td{padding-bottom:8px}
  .lt input{width:100%;background:var(--bg);border:1px solid var(--border);color:#fff;font-family:inherit;
    font-size:16px;padding:5px 6px;border-radius:7px;font-variant-numeric:tabular-nums}
  .lt input::placeholder{color:var(--dim)}
  .lt input:focus{outline:none;border-color:var(--scarlet);box-shadow:0 0 0 2px var(--scarlet-soft)}
  .lt .bwc{color:var(--dim);font-size:12px}
  details.notes{margin:0;padding:6px 10px 8px;border-top:1px solid var(--border)}
  details.notes summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--muted);padding:4px 0}
  details.notes[open] summary{color:#fff}
  details.notes ul{list-style:none;margin-top:6px}
  details.notes li{font-size:12px;color:var(--muted);margin-bottom:6px;line-height:1.45}
  details.notes li b{color:#fff;font-weight:700}

  .runbox{background:var(--panel2);border:1px solid var(--border);border-left:4px solid var(--scarlet);border-radius:6px 11px 11px 6px;padding:12px;margin:10px 0}
  .runbox .ex-name{font-size:15px}
  .hint{text-align:center;color:var(--muted);font-size:13px;padding:26px 10px}
</style>
</head>
<body>
<header class="appbar"><div class="wrap"><div class="monthnav">
    <button id="prevM">‹</button>
    <div class="mtitle" id="mTitle"></div>
    <button id="nextM">›</button>
  </div></div></header>
<div class="wrap">
  <button class="btn-today" id="btnToday">jump to today</button>

  <div class="dow-row"><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div><div>SUN</div></div>
  <div class="cal" id="cal"></div>

  <div class="legend">
    <span><b>•</b> run day</span>
    <span><b>L✓ R✓</b> lift / run done</span>
    <span><b>✗</b> missed — that track slides forward</span>
  </div>

  <div id="detail"></div>
</div>

<script>
'use strict';
/* ============ TIMELINE ============ */
const START = new Date(2026, 9, 19);   // Mon Oct 19 2026
const TOTAL_DAYS = 188;                // through Sat Apr 24 2027 (race day)
const TOTAL_WEEKS = 27;
const BUILD_WEEKS = 25;                // weeks 1–25 shift when you miss; 26 (taper) + 27 (race) stay locked to the race date
const DELOADS = [5, 10, 15, 20];
const LS_KEY = 'tc27v4';
const MONTHS = [
  {y:2026,m:9,name:'October 2026'},{y:2026,m:10,name:'November 2026'},{y:2026,m:11,name:'December 2026'},
  {y:2027,m:0,name:'January 2027'},{y:2027,m:1,name:'February 2027'},{y:2027,m:2,name:'March 2027'},
  {y:2027,m:3,name:'April 2027'}
];

const PHASES = [
  {name:'Phase 1 · Base',                 from:1,  to:5},
  {name:'Phase 2 · Build',                from:6,  to:10},
  {name:'Phase 3 · Strength + Threshold', from:11, to:15},
  {name:'Phase 4 · Power + VO₂max',       from:16, to:20},
  {name:'Phase 5 · Race-Specific',        from:21, to:25},
  {name:'Phase 6 · Taper + Race',         from:26, to:27}
];
function phaseOf(w){ for(let i=0;i<PHASES.length;i++) if(w>=PHASES[i].from&&w<=PHASES[i].to) return i+1; return 6; }

const PHASE_LIFT_NOTE = {
  1:'Base block: moderate loads, 2–3 reps in reserve. Rebuilding work capacity, tendons and technique after time off — the foundation everything heavier sits on.',
  2:'Build block: loads climb, reps drop to 6–8. Still hypertrophy-driven, now with real strength carryover.',
  3:'Strength block: one heavy top set, then back-offs. Long rests — strength needs full recovery between sets.',
  4:'Peak strength + power: heaviest loads of the plan (3–5 reps), paired with max-intent jumps.',
  5:'Race-specific: volume drops by about a third while load stays heavy. Strength and size hold on far less volume as long as intensity stays high (Bickel 2011) — that frees your legs for goal-pace running.',
  6:'Taper: two crisp sets, well short of failure. Maintain, don\'t build — the race is the priority now.'
};

/* ============ REP SCHEMES ============ */
function scheme(role, week){
  if (DELOADS.includes(week)) return {main:{s:2,r:'6-8',rir:'3-4',rest:'2.5 min'},secondary:{s:2,r:'8-10',rir:'3-4',rest:'2 min'},
    iso:{s:2,r:'12',rir:'3',rest:'60 s'},core:{s:2,r:'10',rir:'3',rest:'60 s'}}[role];
  const T = {
    1:{main:{s:3,r:'8-10',rir:'2-3',rest:'2.5 min'},secondary:{s:3,r:'8-12',rir:'2',rest:'2 min'},iso:{s:3,r:'12-15',rir:'1-2',rest:'75 s'},core:{s:3,r:'10-15',rir:'1-2',rest:'60 s'}},
    2:{main:{s:4,r:'6-8',rir:'1-2',rest:'3 min'},secondary:{s:3,r:'8-10',rir:'1-2',rest:'2.5 min'},iso:{s:3,r:'10-15',rir:'0-1',rest:'75 s'},core:{s:3,r:'10-15',rir:'0-1',rest:'60 s'}},
    3:{main:{s:4,r:'4-6 top set → 6-8 back-offs',rir:'1',rest:'3-4 min'},secondary:{s:3,r:'6-8',rir:'1-2',rest:'2.5 min'},iso:{s:3,r:'10-12',rir:'0-1',rest:'75 s'},core:{s:3,r:'10-12',rir:'1',rest:'60 s'}},
    4:{main:{s:4,r:'3-5',rir:'1-2',rest:'3-5 min'},secondary:{s:3,r:'6-8',rir:'1-2',rest:'2.5 min'},iso:{s:2,r:'10-12',rir:'0-1',rest:'75 s'},core:{s:2,r:'10-12',rir:'1',rest:'60 s'}},
    5:{main:{s:3,r:'4-6',rir:'2',rest:'3 min'},secondary:{s:2,r:'6-8',rir:'2',rest:'2.5 min'},iso:{s:2,r:'10-12',rir:'1',rest:'75 s'},core:{s:2,r:'10-12',rir:'1',rest:'60 s'}},
    6:{main:{s:2,r:'3-5',rir:'3',rest:'3 min'},secondary:{s:2,r:'6-8',rir:'3',rest:'2 min'},iso:{s:2,r:'10-12',rir:'2',rest:'60 s'},core:{s:2,r:'10-12',rir:'2',rest:'60 s'}}
  };
  return T[phaseOf(week)][role];
}
function jumpScheme(week){
  if (DELOADS.includes(week)) return {s:2,r:'3',note:'Deload: keep the pattern crisp, skip the strain.'};
  return {1:{s:3,r:'3-5',note:'Sub-maximal. Learn the landing — soft, quiet, absorb through the hips. Power is a skill, not conditioning.'},
          2:{s:4,r:'3',note:'Maximal intent on every rep. Full recovery between sets — never jump tired.'},
          3:{s:4,r:'3',note:'Peak intent. Add a single-leg bound variation if it feels good. Rest 2 min.'},
          4:{s:4,r:'2-3',note:'Peak explosiveness block. Maximal height/distance, full 2–3 min rest. Quality over everything.'},
          5:{s:3,r:'3',note:'Maintenance: crisp and fast, stop well before fatigue — legs need to be fresh for goal-pace runs.'},
          6:{s:2,r:'3',note:'A few snappy reps to stay springy. Nothing more.'}}[phaseOf(week)];
}

/* ============ SPLIT — PPL ×2 (dow 0=Mon .. 5=Sat) ============ */
const LIFTS = {
  0:{ title:'LEGS A — squats + power', ex:[
      {id:'cmj',    name:'Countermovement Vertical Jump', role:'power', note:'Jumps go FIRST, while the nervous system is fresh.'},
      {id:'bsquat', name:'Barbell Back Squat',   role:'main',  note:'Your primary lower lift. Ramp: 50%×5, 70%×3, 85%×1 → work sets. Depth to at least parallel, brace hard, drive the floor away.'},
      {id:'legpr',  name:'Leg Press',            role:'secondary', note:'Adds quad volume with low systemic fatigue — ideal alongside heavy squats + running.'},
      {id:'bss',    name:'Bulgarian Split Squat',role:'secondary', note:'Unilateral: fixes side-to-side imbalance, huge stretch on the front leg (lengthened-position growth).'},
      {id:'legext', name:'Leg Extension',        role:'iso',   note:'Isolates the quads at short length — completes the strength curve the squat misses.'},
      {id:'calfst', name:'Standing Calf Raise',  role:'iso',   note:'Gastrocnemius. Pause 2 s in the stretch. Bulletproofs the lower leg for run volume.'},
      {id:'hlr',    name:'Hanging Leg Raise',    role:'core',  note:'Full ROM, no swing. Superset with calves to save time.'}
  ]},
  1:{ title:'PUSH A — chest focus', ex:[
      {id:'bench',  name:'Barbell Bench Press',  role:'main',  note:'Ramp: 50%×5, 70%×3, 85%×1 → work sets. Touch mid-chest, elbows ~45°, drive with the legs.'},
      {id:'incldb', name:'Incline DB Press',     role:'secondary', note:'Upper-chest bias + deep stretch at the bottom. DBs let each side work independently.'},
      {id:'pecfly', name:'Pec Deck / Cable Fly', role:'iso',   note:'Pure chest isolation. Squeeze 1 s, control the stretch.'},
      {id:'latrA',  name:'DB Lateral Raise',     role:'iso',   note:'Side delts = shoulder width. Lead with the elbow, no swing.'},
      {id:'ohtri',  name:'Overhead Cable Triceps Ext.', role:'iso', note:'Long-head at full stretch — grows the triceps more than pushdowns alone.'}
  ]},
  2:{ title:'PULL A — back thickness', ex:[
      {id:'wpu',    name:'Weighted Pull-Up',     role:'main',  note:'Ramp with bodyweight sets first. Add load once you own 3×8 bodyweight. Full dead hang, chest to the bar.'},
      {id:'bbrow',  name:'Barbell Row',          role:'secondary', note:'Torso ~15° above parallel, pull to the lower ribs. Builds a thick back and braces the whole posterior chain.'},
      {id:'facep',  name:'Face Pull',            role:'iso',   note:'Rear delts + external rotators = shoulder health insurance against all the pressing.'},
      {id:'bbcurl', name:'Barbell Curl',         role:'iso',   note:'Heaviest biceps movement. Control the negative 2–3 s.'},
      {id:'inccrl', name:'Incline DB Curl',      role:'iso',   note:'Arms behind the body = biceps at full stretch = lengthened-position growth.'}
  ]},
  3:{ title:'LEGS B — hinge + power', ex:[
      {id:'broad',  name:'Broad Jump',           role:'power', note:'Jumps go FIRST, while the nervous system is fresh.'},
      {id:'rdl',    name:'Romanian Deadlift',    role:'main',  note:'Ramp to work sets. Soft knees, push hips back, feel the stretch, bar close. Stop when your back would round.'},
      {id:'hipthr', name:'Barbell Hip Thrust',   role:'secondary', note:'Direct glute overload — your engine for sprinting and the last 5K of a race. Full lockout, squeeze 1 s.'},
      {id:'legcrl', name:'Seated Leg Curl',      role:'secondary', note:'Seated > lying: more hamstring stretch = more growth (Maeo 2021). Also knee insurance at run volume.'},
      {id:'calfse', name:'Seated Calf Raise',    role:'iso',   note:'Soleus (bent knee) — the true workhorse of distance running.'},
      {id:'cabcr',  name:'Cable Crunch',         role:'core',  note:'Load the abs like any muscle. Flex the spine, exhale hard at the bottom.'}
  ]},
  4:{ title:'PUSH B — shoulder focus', ex:[
      {id:'ohp',    name:'Barbell Overhead Press', role:'main', note:'Ramp to work sets. Glutes tight, ribs down, bar finishes over mid-foot. Total-body strength lift.'},
      {id:'dip',    name:'Weighted Dip',        role:'secondary', note:'Lean forward for chest, stay upright for triceps. Full depth, control the stretch.'},
      {id:'lowfly', name:'Low-to-High Cable Fly',role:'iso',   note:'Upper-chest bias to complement flat pressing.'},
      {id:'latrB',  name:'Cable Lateral Raise',  role:'iso',   note:'2nd weekly side-delt hit — constant tension through the whole range.'},
      {id:'pushdn', name:'Triceps Rope Pushdown',role:'iso',   note:'Spread the rope at lockout, squeeze 1 s.'}
  ]},
  5:{ title:'PULL B — width + arms', ex:[
      {id:'latpd',  name:'Lat Pulldown',         role:'main',  note:'Wide grip, drive elbows down and in, full stretch at the top. Quality over max load if it follows a long run.'},
      {id:'cblrow', name:'Seated Cable Row',     role:'secondary', note:'Neutral grip, drive elbows back, squeeze the shoulder blades.'},
      {id:'sapd',   name:'Straight-Arm Pulldown',role:'iso',   note:'Isolates the lats at long length — pure width builder.'},
      {id:'rdelt',  name:'Rear-Delt Fly',        role:'iso',   note:'3D shoulders + posture. High reps, no momentum.'},
      {id:'hammer', name:'Hammer Curl',          role:'iso',   note:'Brachialis + forearm — thick arms from every angle.'}
  ]}
};
const SHORT = {0:'Legs A',1:'Push A',2:'Pull A',3:'Legs B',4:'Push B',5:'Pull B'};

/* ============ RUN WARM-UP / COOL-DOWN (tailored by run type) ============ */
const RUN_PREP = {
  easy:['3–4 min brisk walk easing into a slow jog — let the first mile be part of the warm-up',
        'Leg swings — front-to-back ×12/leg, side-to-side ×12/leg',
        'Walking lunge with overhead reach ×8/leg',
        'Ankle circles ×10 each way + 20 pogo hops'],
  hard:['8–10 min easy jog to raise core temperature',
        'Leg swings — front-to-back ×12/leg, side-to-side ×12/leg',
        'Walking lunges ×8/leg + walking knee hugs ×8/leg',
        'Drills: A-skips, high knees, butt kicks — 2×20 m each',
        '4×15 s strides building to ~95%, full walk-back recovery — THEN start the work'],
  long:['4–5 min brisk walk into an easy jog',
        'Leg swings — front-to-back ×12/leg, side-to-side ×12/leg',
        'Walking lunges ×8/leg + leg cradles ×8/leg (hip openers)',
        'World\'s greatest stretch ×5/side',
        'Run the first 10 min slower than easy pace — ease in, the distance does the work'],
  race:['15–20 min before the gun: brisk walk → 8–10 min easy jog',
        'Leg swings, walking lunges, A-skips, high knees — 20 m each',
        '4×15 s strides, the last one right at goal pace (8:00/mi)',
        'Stay warm and moving in the corral; sip water, no new foods']
};
const RUN_COOL = {
  easy:['2–3 min walk until breathing settles',
        'Wall calf stretch, straight + bent knee — 30 s each/side',
        'Standing quad / hip-flexor stretch — 30 s/side',
        'Standing hamstring stretch — 30 s/side'],
  hard:['5–10 min very easy jog or walk to flush the legs',
        'Wall calf stretch, straight + bent knee — 40 s each/side',
        'Couch stretch (hip flexors + quads) — 45 s/side',
        'Figure-4 glute stretch — 40 s/side',
        'Standing hamstring stretch — 40 s/side'],
  long:['5 min walk, then refuel + rehydrate within 30 min (carbs + protein)',
        'Couch stretch — 60 s/side',
        'Pigeon pose (glutes / hips) — 60 s/side',
        'Standing hamstring stretch — 45 s/side',
        'Wall calf stretch, straight + bent knee — 45 s each/side',

function idxOfDate(d){ return Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate()) - START)/86400000); }
function dateOfIdx(i){ const d=new Date(START); d.setDate(d.getDate()+i); return d; }
function weekOf(i){ return Math.floor(i/7)+1; }
function dowOf(i){ return i%7; }
function inPlan(i){ return i>=0 && i<TOTAL_DAYS; }
function todayIdx(){ return idxOfDate(new Date()); }

/* ============ ADAPTIVE SCHEDULE ============
   Lifts and runs are two independent queues of planned sessions (weeks 1–25).
   Each queue is laid onto its calendar slots in order. Marking a slot MISSED
   means that planned session wasn't done, so it moves to the next slot and the
   rest of that queue slides back by one. Done / unmarked slots don't shift
   anything. Taper (wk 26) and race week (wk 27) stay locked to the race date. */
const LIFT_DOWS=[0,1,2,3,4,5], RUN_DOWS=[1,2,4,5];
const liftDays=[], runDays=[], LIFT_SEQ=[], RUN_SEQ=[];
for(let i=0;i<TOTAL_DAYS;i++){
  const w=weekOf(i), dw=dowOf(i);
  if (w>BUILD_WEEKS) break;
  if (LIFT_DOWS.includes(dw)) liftDays.push(i);
  if (RUN_DOWS.includes(dw)) runDays.push(i);
}
for(let w=1;w<=BUILD_WEEKS;w++){
  LIFT_DOWS.forEach(dw=>LIFT_SEQ.push({week:w,dow:dw}));
  RUN_DOWS.forEach(dw=>RUN_SEQ.push({week:w,dow:dw}));
}
function planFor(track,i){
  const days = track==='lift'?liftDays:runDays, seq = track==='lift'?LIFT_SEQ:RUN_SEQ;
  const pos = days.indexOf(i);
  if (pos<0) return null;
  let missed=0;
  for(let p=0;p<pos;p++) if(getMark(track,days[p])==='missed') missed++;
  const s=seq[pos-missed];
  return {week:s.week, dow:s.dow, shifted:missed};
}
function totalShift(track){
  const days = track==='lift'?liftDays:runDays;
  return days.reduce((n,d)=>n+(getMark(track,d)==='missed'?1:0),0);
}

/* What's on day i: {lift, run, race} — lift/run carry their PLAN week (which may lag the calendar after misses). */
function dayPlan(i){
  const w=weekOf(i), dw=dowOf(i), out={lift:null, run:null, race:false};
  if (w<=BUILD_WEEKS){
    const L=planFor('lift',i);
    if (L) out.lift={...LIFTS[L.dow], short:SHORT[L.dow], week:L.week, dow:L.dow, shifted:L.shifted};
    const R=planFor('run',i);
    if (R) out.run={...RUNS[R.week][R.dow], week:R.week, dow:R.dow, shifted:R.shifted};
  } else if (w===26){
    if (dw<=5) out.lift={...LIFTS[dw], short:SHORT[dw], week:26, dow:dw, shifted:0};
    if (RUNS[26][dw]) out.run={...RUNS[26][dw], week:26, dow:dw, shifted:0};
  } else {
    const S=RACE_WEEK[dw];
    if (S){
      if (S.lift) out.lift={...S.lift, week:27, dow:dw, shifted:0, fixed:true};
      if (S.run)  out.run={...S.run, week:27, dow:dw, shifted:0};
      out.race=!!S.race;
    }
  }
  return out;
}

/* ============ CALENDAR ============ */
let curMonth = 0;
let selIdx = null;
function monthOfIdx(t){
  const ref = inPlan(t) ? dateOfIdx(t) : (t<0 ? START : dateOfIdx(TOTAL_DAYS-1));
  const mi = MONTHS.findIndex(o=>o.y===ref.getFullYear() && o.m===ref.getMonth());
  return mi<0 ? 0 : mi;
}
curMonth = monthOfIdx(todayIdx());

function renderCal(){
  const mo = MONTHS[curMonth];
  $('mTitle').textContent = mo.name;
  $('prevM').disabled = curMonth<=0;
  $('nextM').disabled = curMonth>=MONTHS.length-1;
  const cal = $('cal'); cal.innerHTML='';
  const first = new Date(mo.y, mo.m, 1);
  const lead = (first.getDay()+6)%7; // Mon=0
  const dim = new Date(mo.y, mo.m+1, 0).getDate();
  const tIdx = todayIdx();
  for(let b=0;b<lead;b++){ const c=document.createElement('div'); c.className='cell blank'; cal.appendChild(c); }
  for(let day=1;day<=dim;day++){
    const i=idxOfDate(new Date(mo.y,mo.m,day));
    const c=document.createElement('div');
    if(!inPlan(i)){
      c.className='cell out';
      c.innerHTML='<div class="dnum">'+day+'</div>';
    } else {
      const P=dayPlan(i);
      const rest=!P.lift && !P.run;
      const lab = P.race ? 'RACE' : P.lift ? P.lift.short : P.run ? P.run.t.split(' — ')[0] : 'Rest';
      const labTxt = ({Sharpener:'Race pace', Shakeout:'Shake out'})[lab] || lab;
      const marks=[]; let mk='';
      if (P.lift){ const m=getMark('lift',i); marks.push(m); if(m) mk+='<span class="'+m+'">L'+(m==='done'?'✓':'✗')+'</span>'; }
      if (P.run){  const m=getMark('run',i);  marks.push(m); if(m) mk+='<span class="'+m+'">R'+(m==='done'?'✓':'✗')+'</span>'; }
      let cls='cell';
      if (rest) cls+=' rest';
      if (P.race) cls+=' race';
      if (marks.length && marks.every(m=>m==='missed')) cls+=' allmissed';
      else if (marks.length && marks.every(m=>m==='done')) cls+=' alldone';
      if (i===tIdx) cls+=' today';
      if (i===selIdx) cls+=' sel';
      c.className=cls;
      c.innerHTML='<div class="dnum">'+day+'</div>'+(P.run?'<div class="rdot"></div>':'')+
        (mk?'<div class="mk">'+mk+'</div>':'')+'<div class="lab'+(labTxt.length>6?' sm':'')+'">'+labTxt+'</div>';
      c.addEventListener('click',()=>{ selIdx=i; renderCal(); renderDetail(i); $('detail').scrollIntoView({behavior:'smooth',block:'start'}); });
    }
    cal.appendChild(c);
  }
}

function renderDetail(i){
  const w=weekOf(i), dow=dowOf(i), p=phaseOf(w);
  const d=dateOfIdx(i);
  const P=dayPlan(i);
  const {lift, run} = P;
  const cat = run ? runCat(run) : null;

  let badge='';
  if ((lift&&DELOADS.includes(lift.week)) || (run&&DELOADS.includes(run.week))) badge+=' <span class="badge">DELOAD</span>';
  if (P.race) badge+=' <span class="badge">RACE DAY</span>';

  const phaseLine = 'Week '+w+' of '+TOTAL_WEEKS+' · '+PHASES[p-1].name;

  if (!lift && !run){
    const body='<div class="section"><div class="note-line">Full rest. Sleep 8+, hit your protein, walk if you like. The stimulus was this week — today is when it becomes muscle and mitochondria.</div></div>'+
      '<div class="section"><div class="sec-label">Warm-up stretches — morning mobility (5 min)</div>'+bullets(REST_PREP)+'</div>'+
      '<div class="section"><div class="sec-label">Cool-down stretches — evening wind-down (10 min)</div>'+bullets(REST_COOL)+'</div>';
    paint(d,'Rest',badge,phaseLine,body); return;
  }

  const parts=[]; if(lift) parts.push(lift.short); if(run) parts.push(run.t.split(' — ')[0]);
  const title = P.race ? 'Race Day' : parts.join('  +  ');

  let body='';

  /* schedule-shift banner */
  const sl=lift?lift.shifted:0, sr=run?run.shifted:0;
  if (sl||sr){
    const bits=[]; if(sl) bits.push(sl+' lift'+(sl>1?'s':'')); if(sr) bits.push(sr+' run'+(sr>1?'s':''));
    body+='<div class="section"><div class="note-line">Schedule shifted — you\'re '+bits.join(' and ')+' behind the original plan, so today shows the session you still owe. Taper (from Apr 12) and race day (Apr 24) stay locked; anything that no longer fits drops off the end of the race-specific block.</div></div>';
  }

  /* session order */
  let runFirst=false;
  if (lift && run){
    let msg;
    if (cat==='hard'){ runFirst=true; msg='Run the quality session FRESH — ideally morning, lift later (6+ h apart if you can). Hard running and heavy lifting compete for recovery; separating them protects both.'; }
    else if (cat==='long'){ runFirst=true; msg='Long run first (morning); lift 4–6 h later after eating and rehydrating. Keep the lift honest but not heroic.'; }
    else msg='Lift first, then the easy run — lifting first protects strength, and the run is easy anyway.';
    body+='<div class="section"><div class="sec-label">Session order</div><div class="note-line">'+msg+'</div>';
    if (!lift.fixed && (lift.dow===0||lift.dow===3) && (cat==='hard'||cat==='long'))
      body+='<div class="note-line">Heads up — the shift put a leg day on a '+(cat==='hard'?'quality':'long')+' run day. Run first and fresh, then either drop a set from each leg exercise or mark the lift missed to slide it to tomorrow.</div>';
    body+='</div>';
  }

  /* lift block */
  let liftH='';
  if (lift){
    liftH+='<div class="section"><div class="sec-head"><div class="sec-label">Lift — '+lift.title+planTag(lift,w)+'</div>'+markRow('lift',i)+'</div>';
    const pn = lift.fixed ? lift.note : (DELOADS.includes(lift.week) ? 'Deload week: same exercises, fewer sets, lighter effort. Let the last block sink in.' : PHASE_LIFT_NOTE[phaseOf(lift.week)]);
    const kind = lift.kind || LIFT_KIND[lift.dow];
    liftH+='<div class="note-line">'+pn+'</div>';
    liftH+='<div class="sub-label">Warm-up stretches — before (dynamic, no long holds)</div>'+bullets(LIFT_PREP[kind]);
    liftH+=liftTable(i,lift);
    liftH+='<div class="sub-label">Cool-down stretches — after</div>'+bullets(LIFT_COOL[kind]);
    liftH+='</div>';
  }

  /* run block: warm-up → run → cool-down */
  let runH='';
  if (run){
    runH+='<div class="section"><div class="sec-head"><div class="sec-label">Run'+planTag(run,w)+'</div>'+markRow('run',i)+'</div>';
    runH+='<div class="sub-label" style="margin-top:4px">Warm-up stretches — before</div>'+bullets(RUN_PREP[cat]);
    runH+='<div class="runbox"><div class="ex-name">'+run.t+'</div><div class="ex-note">'+run.d+'</div></div>';
    runH+='<div class="sub-label">Cool-down stretches — after</div>'+bullets(RUN_COOL[cat]);
    runH+='</div>';
  }

  body += runFirst ? runH+liftH : liftH+runH;
  paint(d,title,badge,phaseLine,body);
}

function paint(d,title,badge,phase,body){
  $('detail').innerHTML =
    '<div class="card"><div class="card-head"><div class="meta">'+
      '<div class="d-date">'+fmtLong(d).toUpperCase()+'</div>'+
      '<div class="d-title">'+title+badge+'</div>'+
      '<div class="d-phase">'+phase+'</div>'+
    '</div><button class="closeb" id="closeD">×</button></div>'+
    '<div class="card-body">'+body+'</div></div>';
  $('closeD').addEventListener('click',()=>{ selIdx=null; renderCal(); $('detail').innerHTML=''; });
  wireInputs();
}

function logKey(i,exId,k){ return i+':'+exId+':'+k; }

/* ============ LOAD PROGRESSION (main lifts) ============
   Takes the TOP weight from the last session you logged for that lift and converts it to an estimated 1RM:
     e1RM = top weight × (1 + (reps + RIR) / 30)          (Epley; assumes you stopped at that day's target RIR)
   Today's working weight = e1RM ÷ (1 + (today's low-end reps + today's RIR) / 30), rounded to 5 lb.
   Hit more reps or more weight and every number climbs; a new rep range (next phase / deload) converts exactly.
   Ramp into the first working set: 50%×5 → 70%×3 → 85%×1 of it. */
const MAIN_CFG = {bsquat:{min:45}, bench:{min:45}, rdl:{min:45}, ohp:{min:45}, latpd:{min:5}, wpu:{bw:true}};
function rng(s){ const m=String(s).match(/(\d+)(?:-(\d+))?/); return {lo:+m[1], hi:+(m[2]||m[1])}; }
function mid(s){ const r=rng(s); return (r.lo+r.hi)/2; }
function r5(x){ return Math.round(x/5)*5; }
function lastSession(i, exId){
  for(let j=i-1;j>=0;j--){
    const sets=[];
    for(let k=0;k<6;k++){ const v=state.logs[logKey(j,exId,k)]; if(v&&(v.w||v.r)) sets.push({w:parseFloat(v.w)||0, r:parseInt(v.r,10)||0}); }
    if (sets.length) return {day:j, sets};
  }
  return null;
}
function topSet(sets){ let t=null; sets.forEach(s=>{ if(!t||s.w>t.w||(s.w===t.w&&s.r>t.r)) t=s; }); return t; }
function setTargets(lift, nSets){ // per working set: {lo, rir, label, pct?}
  if (lift.fixed) return Array.from({length:nSets},(_,k)=>({lo:5, rir:4, pct:0.6, label:String(k+1)}));
  const sc=scheme('main',lift.week), rir=mid(sc.rir), rs=String(sc.r).match(/\d+(?:-\d+)?/g);
  const topR=rng(rs[0]), boR=rs[1]?rng(rs[1]):null;
  return Array.from({length:nSets},(_,k)=>({lo:(k>0&&boR)?boR.lo:topR.lo, hi:(k>0&&boR)?boR.hi:topR.hi, rir,
    label: boR ? (k===0?'Top':'B/O') : String(k+1)}));
}
function prescribe(i, ex, lift, targets){
  const cfg=MAIN_CFG[ex.id];
  const ls=lastSession(i, ex.id);
  const t=ls && topSet(ls.sets);
  if (!t || !t.r) return {none:true};
  if (cfg.bw){ // weighted pull-up: weight = ADDED load; double progression in +5 lb steps
    const next = lift.fixed ? 0 : (t.r>=targets[0].hi ? t.w+5 : t.w);
    const ramp=[{w:'BW',r:5},{w:'BW',r:3}]; if(next>=20) ramp.push({w:'+'+r5(next/2),r:1});
    return {bw:true, last:t, work:targets.map(()=>next), ramp};
  }
  const pl=dayPlan(ls.day).lift;
  const prevRir=(!pl||pl.fixed)?4:mid(scheme('main',pl.week).rir);
  const e1=t.w*(1+(t.r+prevRir)/30);
  const work=targets.map(p=>Math.max(cfg.min, r5(p.pct ? e1*p.pct : e1/(1+(p.lo+p.rir)/30))));
  const ramp=[[.5,5],[.7,3],[.85,1]].map(([pc,r])=>({w:Math.max(cfg.min,r5(work[0]*pc)),r}))
    .filter((x,ix,a)=>x.w<work[0] && (ix===0||x.w!==a[ix-1].w));
  return {last:t, e1, work, ramp};
}
function fmtW(p,w){ return p.bw ? (w>0?'+'+w:'BW') : String(w); }

function liftTable(i, lift){
  let h='<div class="tbox"><table class="lt"><colgroup><col class="c-ex"><col class="c-set"><col class="c-w"><col class="c-r"></colgroup>'+
        '<thead><tr><th>Exercise</th><th>Set</th><th>Weight</th><th>Reps</th></tr></thead>';
  const notes=[];
  lift.ex.forEach(ex=>{
    let s, sch, note=ex.note;
    if (lift.fixed){ s=2; sch=lift.light; }
    else if (ex.role==='power'){ const js=jumpScheme(lift.week); s=js.s; sch=js.s+' × '+js.r+' · max intent · 90 s–2 min rest'; note=js.note+' '+ex.note; }
    else { const sc=scheme(ex.role,lift.week); s=sc.s; sch=sc.s+' × '+sc.r+' · RIR '+sc.rir+' · rest '+sc.rest; }
    notes.push('<b>'+ex.name+'</b> — '+note);

    const isMain = !!MAIN_CFG[ex.id];
    const targets = isMain ? setTargets(lift, s) : Array.from({length:s},(_,k)=>({label:String(k+1)}));
    const pres = isMain ? prescribe(i, ex, lift, targets) : null;
    const ls = isMain ? null : lastSession(i, ex.id);

    let info='';
    if (isMain){
      if (pres.none) info='No previous log yet — pick a weight you could do for '+(targets[0].lo||5)+'+ reps with a couple in the tank. Log it and the app calculates every session after.';
      else {
        const lw = pres.bw ? (pres.last.w>0?'+'+pres.last.w:'BW') : pres.last.w;
        const tw = targets.some(t=>t.label==='B/O') ? 'Top '+fmtW(pres,pres.work[0])+' · back-offs '+fmtW(pres,pres.work[1]) : fmtW(pres,pres.work[0])+(pres.bw?'':' lb');
        info='Last top set: '+lw+' × '+pres.last.r+'<br>Today: <b>'+tw+'</b>';
      }
    } else if (ls){ const t=topSet(ls.sets); if(t) info='Last: '+(t.w||'BW')+' × '+t.r; }

    const ramp = (pres && !pres.none) ? pres.ramp : [];
    const rows = ramp.length + s;
    h+='<tbody>';
    let first=true;
    const exCell=()=>{ if(!first) return ''; first=false;
      return '<td class="exc" rowspan="'+rows+'"><div class="exn">'+ex.name+'</div><div class="exs">'+sch+'</div>'+(info?'<div class="ext">'+info+'</div>':'')+'</td>'; };
    ramp.forEach((r,ix)=>{
      h+='<tr class="wu">'+exCell()+'<td class="sc">WU'+(ix+1)+'</td><td>'+r.w+(r.w===45?' <span class="bwc">bar</span>':'')+'</td><td>'+r.r+'</td></tr>';
    });
    for(let k=0;k<s;k++){
      const key=logKey(i,ex.id,k), cur=state.logs[key]||{};
      const prevSet = ls && ls.sets[k];
      const wPh = pres && !pres.none ? fmtW(pres,pres.work[k]) : (prevSet&&prevSet.w ? prevSet.w : 'lb');
      const rPh = isMain && targets[k].lo ? targets[k].lo+(targets[k].hi&&targets[k].hi!==targets[k].lo?'-'+targets[k].hi:'') : (prevSet&&prevSet.r ? prevSet.r : 'reps');
      const wCell = ex.role==='power' ? '<span class="bwc">BW</span>' :
        '<input type="number" inputmode="decimal" data-k="'+key+'" data-f="w" placeholder="'+wPh+'" value="'+(cur.w||'')+'">';
      h+='<tr>'+exCell()+'<td class="sc">'+targets[k].label+'</td><td>'+wCell+'</td>'+
         '<td><input type="number" inputmode="numeric" data-k="'+key+'" data-f="r" placeholder="'+rPh+'" value="'+(cur.r||'')+'"></td></tr>';
    }
    h+='</tbody>';
  });
  h+='</table>';
  notes.push('<b>How the weights are calculated</b> — your main lift\'s target comes from the TOP set you logged last time: estimated 1RM = weight × (1 + (reps + RIR) ÷ 30), converted to today\'s reps and RIR, rounded to 5 lb. Beat the target and every future number goes up. WU = warm-up ramp into your first working set. Weighted pull-ups: log the ADDED weight (0 = bodyweight).');
  h+='<details class="notes"><summary>Coaching notes</summary><ul>'+notes.map(n=>'<li>'+n+'</li>').join('')+'</ul></details></div>';
  return h;
}
function wireInputs(){
  document.querySelectorAll('#detail input').forEach(inp=>{
    inp.addEventListener('input',()=>{
      const key=inp.dataset.k, f=inp.dataset.f;
      const rec=state.logs[key]||{};
      rec[f]=inp.value;
      if((rec.w===''||rec.w===undefined)&&(rec.r===''||rec.r===undefined)) delete state.logs[key];
      else state.logs[key]=rec;
      save();
    });
  });
  document.querySelectorAll('#detail .mbtn').forEach(b=>{
    b.addEventListener('click',()=>{
      const t=b.dataset.t, i=+b.dataset.i, v=b.dataset.v;
      if (state.marks[t][i]===v) delete state.marks[t][i]; else state.marks[t][i]=v;
      save(); renderCal(); renderDetail(i);
    });
  });
}

/* ============ NAV ============ */
$('prevM').addEventListener('click',()=>{ if(curMonth>0){curMonth--; renderCal();} });
$('nextM').addEventListener('click',()=>{ if(curMonth<MONTHS.length-1){curMonth++; renderCal();} });
$('btnToday').addEventListener('click',()=>{
  const t=todayIdx();
  curMonth=monthOfIdx(t); renderCal();
  if(inPlan(t)){ selIdx=t; renderCal(); renderDetail(t); $('detail').scrollIntoView({behavior:'smooth',block:'start'}); }
  else if(t<0) $('detail').innerHTML='<div class="hint">Week 1 starts Monday, October 19. Tap any day to preview it.</div>';
});

renderCal();
(function(){
  const t=todayIdx();
  if(inPlan(t)){ selIdx=t; renderCal(); renderDetail(t); }
  else if(t<0) $('detail').innerHTML='<div class="hint">Week 1 starts Monday, October 19. Tap any day to preview it.</div>';
})();
</script>
